<form [formGroup]="searchForm" (ngSubmit)="onSubmit()" class="search-form">
  <div class="form-group">
    <label for="city-input">Rechercher une ville</label>
    <div class="input-wrapper">
      <input
        id="city-input"
        type="text"
        formControlName="city"
        placeholder="Paris, Tokyo, Lille..."
        [class.is-invalid]="submitted && cityControl?.invalid"
      />
      <button type="submit">Rechercher</button>
    </div>

    @if (submitted && cityControl?.invalid) {
      <div class="error-message">
        @if (cityControl?.hasError('required')) {
          <span>Veuillez saisir une ville.</span>
        } @else if (cityControl?.hasError('minlength')) {
          <span>Le nom de la ville est trop court.</span>
        }
      </div>
    }
  </div>
</form>
