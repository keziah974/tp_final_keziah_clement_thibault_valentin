<section class="weather-container">
  <div class="weather-header">
    <a routerLink="/home" class="back-link">
      &larr; Retour à l'accueil
    </a>

    <h1 class="weather-title">Météo pour {{ city }}</h1>
  </div>

  @if (city !== '') {
    <div class="weather-content">
      <app-weather [city]="city" />
      <app-forecast [city]="city" />
    </div>
  } @else {
    <p class="route-error">Aucune ville n'a été indiquée.</p>
  }
</section>
