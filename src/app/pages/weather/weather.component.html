<section class="weather-container">
  <div class="weather-header">
    <a routerLink="/home" class="back-link">&larr; Retour a l'accueil</a>
    <h1 class="weather-title">Meteo pour {{ city }}</h1>
  </div>

  <div class="weather-content-placeholder">
    <div class="placeholder-card">
      <h2>Meteo actuelle</h2>
      <p class="placeholder-text">Zone reservee a l'affichage de la meteo actuelle.</p>
    </div>

    <div class="placeholder-card">
      <h2>Previsions sur 5 jours</h2>
      <p class="placeholder-text">Zone reservee aux previsions meteo.</p>
    </div>
  </div>
</section>
